
############################ ENVIRONMENT SETTINGS ############################
dft_script: sub                             #Name of VASP submit script.
potcar_dir: /gpfs/home/cwang/pps/pbe64      #Diretory to access POTCAR
script_dir: ./scripts                       #Prepared slurm scripts.
input_dir: ./input                          #Prepared VASP files and nequIP presets.
work_dir: ./1-calculate                     #Work directory for DPmoire.
n_nodes: 4                                  #Maximum active Slurm jobs in DPmoire-lite --wait polling mode.
username: example                           #Username, deprecated setting, not used anymore.

############################ Workflow Settings  ############################
stage : 0    #Build stage: *0* generates init_mlff, rlx, and optional validation folders; *1* generates md folders; *all* runs the automated submit-and-wait dependency
submit: false            #*false*: only generate folders. *true*: submit generated folders with Slurm.
auto_resub: false       #In --wait mode, resubmit failed jobs once; in stage: all this applies only to waited init/rlx jobs.
vasp_ml: true           # *true*: use VASP MLFF for MD. Stage1 distributes init_mlff/ML_ABN and ML_FFN as ML_AB and ML_FF, and MD collection reads ML_ABN; *false*: collect MD from OUTCAR.
outcar_collect_freq: 8   #Collect 1 data every 8 ionic steps in OUTCAR.
do_relaxation: true      #In stage0, generate stacking relaxation folders under rlx/.
init_mlff: true         #In stage0, generate the initial init_mlff/ folder.
include_monolayer_md: true  #In stage1, also generate md/top_layer and md/bot_layer monolayer MD folders.
outcar_patterns:        #Optional regex list used to discover OUTCAR series during collection. Defaults are kept explicit here for readability.
  - '^OUTCAR$'
  - '^OUTCAR\d+$'
  - '^OUT\d+$'
  - '^out\d+$'

############################ Calculation and Structure Parameters ##############################################
k_mesh: 40              #KPOINTS mesh target, using k*a = K-mesh.
encut_factor: 1.6              #ENCUT multiplier, using ENCUT = ENMAX * max(POTCAR ENMAX).
r_cut: -1               #Value written to ML_RCUT1 and ML_RCUT2. Use a negative value for the automatic estimate based on the largest input-layer in-plane lattice length and d.

sc: 2                   #Supercell expansion for MD and, when sc_rlx is true, relaxation. An integer means [n, n]; a pair [m, n] allows rectangular supercells.
sc_rlx: false            #true: relax supercell stacking structures. false: relax primitive glide structures, then expand the converged CONTCAR during stage1.
d: 7.3                  #Distance value interpreted by d_mode.
d_mode: surface_gap     #surface_gap: min_z(top)-max_z(bot); reference_plane_gap: selected mean-z distance.
#d_reference:           #Optional, only used by reference_plane_gap.
#  top: [Mo]
#  bot: [Mo]
n_sectors: 9            #Stacking-shift grid. An integer means [n, n]; a pair [m, n] allows rectangular grids.
symm_reduce: true        #Reduce shift structures according to symmetry.

twist_val: false         #generate twisted structure to run validation set
max_val_n: 4            #maximum n value of twist angle
min_val_n: 3            #minimum n value of twist angle
